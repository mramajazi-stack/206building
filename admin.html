<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت ساختمان ۲۰۶</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="toast-wrap" aria-live="polite"></div><header><strong>مدیریت ساختمان ۲۰۶</strong><span>{{role}}</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button class="ghost">خروج</button></form></header><main class="container"><section class="hero"><h1>مرکز مدیریت</h1><p>واحدها، شارژ، پرداخت‌ها، اطلاع‌رسانی، قبض‌ها و درخواست‌ها.</p></section><div id="admin" class="grid"></div><section class="panel"><h2>ثبت شارژ ماهانه</h2><form id="chargeForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><input name="unit" placeholder="شماره واحد" inputmode="numeric" required><input name="amount" placeholder="مبلغ به ریال" inputmode="numeric" required><input name="period" placeholder="مثلاً ۱۴۰۵-۰۷" required><button class="primary">ثبت شارژ</button></form></section><section class="panel"><h2>اطلاع‌رسانی</h2><form id="announcementForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><input name="title" placeholder="عنوان" required><textarea name="body" placeholder="متن اطلاعیه" required></textarea><button class="primary">انتشار برای همه</button></form></section><section class="panel"><h2>قطعی آب، برق و گاز</h2><form id="outageForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><select name="kind"><option>آب</option><option>برق</option><option>گاز</option></select><input name="date" type="date" required><input name="start_time" type="time"><input name="end_time" type="time"><textarea name="description" placeholder="توضیحات"></textarea><button class="secondary">ثبت قطعی</button></form></section></main><script src="/script.js"></script><script>loadAdmin();bindAdminForms();</script></body></html>
