<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد ساختمان ۲۰۶</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="toast-wrap" aria-live="polite"></div><header><strong>ساختمان ۲۰۶</strong><span>واحد {{user['unit_no']}}</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button class="ghost">خروج</button></form></header><main class="container"><section class="hero"><div><p class="eyebrow">داشبورد</p><h1>سلام، واحد {{user['unit_no']}}</h1><p>وضعیت شارژ، اطلاعیه‌ها و درخواست‌های شما در یک صفحه.</p></div></section><div id="dashboard" class="grid"></div><section class="panel"><h2>درخواست تعمیرات</h2><form id="requestForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><input name="title" placeholder="عنوان درخواست" required><input name="issue_type" placeholder="نوع خرابی"><textarea name="body" placeholder="توضیحات کامل" required></textarea><button class="primary">ثبت درخواست</button></form></section><section class="panel"><h2>تغییر رمز عبور</h2><form id="passwordForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><input name="old_password" type="password" placeholder="رمز فعلی" required><input name="new_password" type="password" placeholder="رمز جدید، حداقل ۸ کاراکتر" required><button class="secondary">تغییر رمز</button></form></section></main><script src="/script.js"></script><script>loadDashboard(); bindForms();</script></body></html>
