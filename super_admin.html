<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER ADMIN | ساختمان ۲۰۶</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="toast-wrap" aria-live="polite"></div><header><strong>SUPER ADMIN · ساختمان ۲۰۶</strong><span>کنترل کامل سامانه</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button class="ghost">خروج</button></form></header><main class="container"><section class="hero"><p class="eyebrow">مدیریت ارشد</p><h1>کنترل کامل ساختمان</h1><p>رمزهای فعلی هیچ واحدی نمایش داده نمی‌شوند؛ فقط امکان تعیین رمز جدید وجود دارد.</p></section><section class="panel"><h2>مدیریت ۸ واحد</h2><div id="units" class="unit-list"></div></section><section class="panel"><h2>تعیین مدیر ساختمان</h2><form id="managerForm" class="inline-form"><input type="hidden" name="csrf" value="{{csrf_token()}}"><select name="unit" id="managerUnit"></select><button class="primary">تغییر مدیر</button></form></section><section class="panel"><h2>تعیین مبلغ شارژ برای هر واحد</h2><form id="superChargeForm" class="form-grid"><input name="csrf" type="hidden" value="{{csrf_token()}}"><input name="unit" placeholder="شماره واحد" inputmode="numeric" required><input name="amount" placeholder="مبلغ به ریال" inputmode="numeric" required><input name="period" placeholder="مثلاً ۱۴۰۵-۰۷" required><button class="primary">ثبت مبلغ شارژ</button></form></section><section class="panel"><h2>ثبت قبض</h2><form id="billForm" class="form-grid" enctype="multipart/form-data"><input name="csrf" type="hidden" value="{{csrf_token()}}"><select name="kind"><option>آب</option><option>برق</option><option>گاز</option><option>سایر</option></select><input name="amount" placeholder="مبلغ به ریال" inputmode="numeric" required><input name="date" type="date" required><input name="period" placeholder="دوره"><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png"><textarea name="description" placeholder="توضیحات"></textarea><button class="secondary">ثبت قبض</button></form></section><div id="superData" class="grid"></div></main><script src="/script.js"></script><script>loadSuper();bindSuperForms();</script></body></html>
